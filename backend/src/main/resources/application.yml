app:
  auth:
    jwt-secret: ${JWT_SECRET}
  bootstrap:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    username: ${BOOTSTRAP_ADMIN_USERNAME:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
spring:
  application:
    name: alanan-accounting
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:alanan}
    username: ${DB_USERNAME:alanan_app}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
logging:
  level:
    org.springframework.web: INFO
    org.springframework.jdbc: INFO
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
